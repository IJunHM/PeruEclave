<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PERÚ ES MARTE - COME PALOMAS FOREVER</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Creepster&family=Impact&display=swap');
    
    body {
      margin: 0; padding: 0;
      background: #000 url('https://i.imgur.com/5z3kL2P.jpg') center/cover fixed;
      color: #FF0;
      font-family: 'Impact', sans-serif;
      text-align: center;
      overflow: hidden;
    }
    h1 {
      font-family: 'Creepster', cursive;
      font-size: 6vw;
      color: #FF0000;
      text-shadow: 0 0 30px red, 8px 8px 0 #000;
      animation: flash 0.3s infinite alternate;
      margin: 10px;
    }
    @keyframes flash { from {opacity:0.7;} to {opacity:1;} }

    .paloma {
      position: fixed;
      font-size: 80px;
      z-index: 9999;
      pointer-events: none;
      animation: caer linear forwards;
    }
    @keyframes caer {
      to { transform: translateY(120vh) rotate(720deg); }
    }
  </style>
</head>
<body>

  <h1>🇵🇪 PERÚ = MARTE 🪐 COME PALOMAS DE MIERDA 🇵🇪</h1>
  <h2 style="font-size:3.5vw; color:#FFD700; text-shadow: 4px 4px #000;">EL PAÍS DONDE LA GENTE ES TAN POBRE QUE LAS PALOMAS SON COMIDA GOURMET</h2>

  <div style="font-size:2.5vw; color:red; margin:20px;">
    TU AMIGO PERUANO ES UN MARCIANO COME PALOMAS RATÓN DE ALCANTARILLA
  </div>

  <script>
    // TORMENTA DE PALOMAS CAYENDO SIN PARAR
    function crearPaloma() {
      const p = document.createElement('div');
      p.className = 'paloma';
      p.textContent = ['🕊️','🐦','🦅','🍗'][Math.floor(Math.random()*4)];
      p.style.left = Math.random() * 100 + 'vw';
      p.style.top = '-100px';
      p.style.fontSize = (50 + Math.random() * 90) + 'px';
      p.style.transform = `rotate(${Math.random()*360}deg)`;
      p.style.animationDuration = (3 + Math.random() * 5) + 's';
      document.body.appendChild(p);

      setTimeout(() => p.remove(), 10000);
    }

    // Lluvia extrema
    setInterval(crearPaloma, 40);

    // Insultos random flotando
    const insultos = [
      "COME PALOMAS",
      "MARCIANO DE MIERDA",
      "PATA DE POLVO ROJO",
      "PERUANO POBRE",
      "ALIEN SIN CEREBRO",
      "CEVICHE DE RATA",
      "TU MAMÁ COME CUY"
    ];

    setInterval(() => {
      const insulto = document.createElement('div');
      insulto.textContent = insultos[Math.floor(Math.random()*insultos.length)];
      insulto.style.position = 'fixed';
      insulto.style.left = Math.random() * 100 + 'vw';
      insulto.style.top = Math.random() * 100 + 'vh';
      insulto.style.fontSize = '2.5vw';
      insulto.style.color = '#FF0000';
      insulto.style.textShadow = '0 0 20px yellow';
      insulto.style.opacity = '0.9';
      insulto.style.zIndex = '999';
      insulto.style.pointerEvents = 'none';
      document.body.appendChild(insulto);

      setTimeout(() => insulto.remove(), 4000);
    }, 300);

    // Fondo de sonido caótico (cumbia + palomas)
    const audio = new Audio('https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3');
    audio.loop = true;
    audio.volume = 0.35;
    audio.play().catch(()=>{});
  </script>
</body>
</html>
